# Cloudflare Workers + D1 部署配置（**可读可写**）
#
# 与早先那版「只读」不同：现在写接口都实现了，数据存在 D1，
# 因此在 Cloudflare 上也能新增/修改/删除条目与文件夹。
#
# 首次部署步骤：
#   1) 建库
#        npx wrangler d1 create form-atlas
#      把命令输出的 database_id 填到下面 database_id 那一行
#   2) 建表
#        npx wrangler d1 execute form-atlas --file=worker/schema.sql --remote
#   3) 灌入现有内容
#        node tools/migrate-to-d1.mjs --sql > worker/seed.sql
#        npx wrangler d1 execute form-atlas --file=worker/seed.sql --remote
#   4) 部署
#        npx wrangler deploy
#
# 可选：想支持上传图片，再建一个 R2 桶并取消 [[r2_buckets]] 的注释。

name = "form-atlas"
main = "worker/index.js"
compatibility_date = "2026-08-04"

# ---- 数据：D1 ----
[[d1_databases]]
binding = "DB"                       # api.js 里用 env.DB
database_name = "form-atlas"
database_id = "在这里填入 wrangler d1 create 输出的 id"

# ---- 图片上传（可选）：R2 ----
# 不绑定也能正常用，只是 /api/upload 会返回 501 并说明原因。
# 启用步骤：npx wrangler r2 bucket create form-atlas-uploads
# 然后把下面三行的注释去掉。
# [[r2_buckets]]
# binding = "UPLOADS"                # api.js 里用 env.UPLOADS
# bucket_name = "form-atlas-uploads"

# ---- 静态资源：public/ 整个目录 ----
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true
