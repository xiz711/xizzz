# Render Blueprint —— 一键把 form-atlas 部署成一个可访问的网址
#
# 用法：Render 控制台 → New → Blueprint → 选这个仓库。
# Render 会读这个文件自动建好 Web Service。
#
# 为什么需要 HOST=0.0.0.0：
#   server.mjs 默认只监听 127.0.0.1（本机自用）。容器托管必须监听所有网卡，
#   否则 Render 的健康检查连不上，服务会被判定为启动失败。
services:
  - type: web
    name: form-atlas
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      # PORT 由 Render 注入，server.mjs 会自己读取
      - key: NODE_VERSION
        value: '22'

# ⚠️ 关于数据保存，部署后请务必了解：
#
# 免费实例的文件系统是**临时的**，重新部署或实例重启后，
# data/ 与 public/assets/uploads/ 会回到仓库里的版本 —— 也就是你在网页上
# 新增/修改/删除的条目、文件夹、上传的图片**都会丢失**。
#
# 想真正保存，需要挂载持久磁盘（Render 的 Disk 需要付费套餐）：
#   在服务设置里加一个 Disk，Mount Path 填  data
#   然后确认 Uploads 也落在磁盘上（图片默认写到 public/assets/uploads，属于临时盘）
#
# 稳妥的用法有两种：
#   A) 只在本地「扩充」页编辑，编辑完导出 JSON 并 push 到仓库 —— 线上永远是仓库版本
#   B) 升级到带 Disk 的套餐，把 data/ 挂成持久盘
